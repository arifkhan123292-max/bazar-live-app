<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Bazar - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #f1f2f6; }
        .navbar { background-color: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { margin: 0; font-size: 20px; }
        .main-container { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { color: #34495e; border-bottom: 2px solid #34495e; padding-bottom: 8px; font-size: 20px; }
        .form-section { background: #f9f9f9; padding: 15px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #2ecc71; }
        .grid-inputs { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 10px; }
        .full-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; margin-bottom: 10px; }
        input, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button.btn-add { background-color: #2ecc71; color: white; border: none; cursor: pointer; font-weight: bold; width: 100%; }
        button.btn-add:hover { background-color: #27ae60; }
        
        .product-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .product-table th, .product-table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 15px; vertical-align: middle; }
        .product-table th { background-color: #34495e; color: white; }
        .admin-img-preview { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete:hover { background: #c0392b; }
        
        .admin-footer-btn { display: inline-flex; align-items: center; gap: 8px; background-color: #0088cc; color: white; text-decoration: none; padding: 10px 15px; border-radius: 4px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1><i class="fas fa-user-shield"></i> Khan Bazar - এডমিন প্যানেল</h1>
        <span>লাইভ কন্ট্রোল</span>
    </div>

    <div class="main-container">
        <h2>নতুন পণ্য ও মূল্য তালিকা আপডেট করুন</h2>
        
        <div class="form-section">
            <div class="grid-inputs">
                <input type="text" id="admin-pname" placeholder="পণ্যের নাম (যেমন: দেশি পেঁয়াজ)">
                <input type="number" id="admin-pprice" placeholder="মূল্য (টাকা)">
            </div>
            <input type="text" id="admin-pimg" class="full-input" placeholder="পণ্যের ছবির অনলাইন লিংক/URL (ঐচ্ছিক)">
            <button class="btn-add" id="add-product-btn"><i class="fas fa-plus"></i> তালিকায় নতুন পণ্য যুক্ত করুন</button>
        </div>

        <h2>বর্তমান লাইভ বাজার তালিকা (<span id="product-count">0</span>টি আইটেম)</h2>
        <table class="product-table">
            <thead>
                <tr>
                    <th>ছবি</th>
                    <th>পণ্যের নাম</th>
                    <th>মূল্য</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody id="admin-product-list">
            </tbody>
        </table>

        <div style="margin-top: 30px; text-align: center; border-top: 1px solid #eee; padding-top: 15px;">
            <p style="color: #666; font-size: 14px;">অর্ডার রিসিভিং সেটআপ হোয়াটসঅ্যাপ নম্বর: <strong>+8801749672230</strong></p>
            <a href="https://wa.me" target="_blank" class="admin-footer-btn">
                <i class="fab fa-whatsapp"></i> সরাসরি হোয়াটসঅ্যাপ প্যানেল টেস্ট করুন
            </a>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, name: "মিনিকেট চাল (৫ কেজি)", price: 350, img: "https://unsplash.com" },
            { id: 2, name: "সয়াবিন তেল (১ লিটার)", price: 165, img: "https://unsplash.com" },
            { id: 3, name: "নাজিরশাইল চাল (১ কেজি)", price: 85, img: "https://unsplash.com" },
            { id: 4, name: "মসুর ডাল (১ কেজি)", price: 140, img: "https://unsplash.com" },
            { id: 5, name: "চিনি (১ কেজি)", price: 135, img: "https://unsplash.com" },
            { id: 6, name: "আটা (২ কেজি)", price: 115, img: "https://unsplash.com" },
            { id: 7, name: "পেঁয়াজ (১ কেজি)", price: 90, img: "https://unsplash.com" },
            { id: 8, name: "রসুন (১ কেজি)", price: 220, img: "https://unsplash.com" },
            { id: 9, name: "আদা (১ কেজি)", price: 240, img: "https://unsplash.com" },
            { id: 10, name: "আলু (১ কেজি)", price: 55, img: "https://unsplash.com" },
            { id: 11, name: "লবণ (১ কেজি)", price: 42, img: "https://unsplash.com" },
            { id: 12, name: "হলুদ গুঁড়া (২০০ গ্রাম)", price: 80, img: "https://unsplash.com" },
            { id: 13, name: "মরিচ গুঁড়া (২০০ গ্রাম)", price: 95, img: "https://unsplash.com" },
            { id: 14, name: "সরিষার তেল (৫০০ মিলি)", price: 120, img: "https://unsplash.com" },
            { id: 15, name: "ডিম (১ ডজন)", price: 150, img: "https://unsplash.com" },
            { id: 16, name: "গুঁড়া দুধ (৫০০ গ্রাম)", price: 470, img: "https://unsplash.com" },
            { id: 17, name: "চা পাতা (৪০০ গ্রাম)", price: 160, img: "https://unsplash.com" },
            { id: 18, name: "ডিটারজেন্ট পাউডার (১ কেজি)", price: 140, img: "https://unsplash.com" },
            { id: 19, name: "গায়ে মাখার সাবান (১টি)", price: 60, img: "https://unsplash.com" },
            { id: 20, name: "ডিশওয়াশিং লিকুইড (২৫০ মিলি)", price: 75, img: "https://unsplash.com" },
            { id: 21, name: "টুথপেস্ট (২০০ গ্রাম)", price: 135, img: "https://unsplash.com" },
            { id: 22, name: "মুড়ি (৫০০ গ্রাম)", price: 50, img: "https://unsplash.com" },
            { id: 23, name: "খেজুরি গুড় (১ কেজি)", price: 180, img: "https://unsplash.com" },
            { id: 24, name: "পোলাও চাল (১ কেজি)", price: 150, img: "https://unsplash.com" },
            { id: 25, name: "ঘি (২৫০ গ্রাম)", price: 320, img: "https://unsplash.com" }
        ];

        let products = JSON.parse(localStorage.getItem('bazar_products')) || defaultProducts;

        function renderAdminTable() {
            const tbody = document.getElementById('admin-product-list');
            tbody.innerHTML = "";
            document.getElementById('product-count').innerText = products.length;

            products.forEach((product, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img class="admin-img-preview" src="${product.img || 'https://placeholder.com'}" alt="img"></td>
                    <td><strong>${product.name}</strong></td>
                    <td>${product.price} টাকা</td>
                    <td><button class="btn-delete" onclick="deleteProduct(${index})"><i class="fas fa-trash"></i> ডিলিট</button></td>
                `;
                tbody.appendChild(tr);
            });
            localStorage.setItem('bazar_products', JSON.stringify(products));
        }

        document.getElementById('add-product-btn').addEventListener('click', function() {
            const nameInput = document.getElementById('admin-pname');
            const priceInput = document.getElementById('admin-pprice');
            const imgInput = document.getElementById('admin-pimg');
            
            if(nameInput.value.trim() === "" || priceInput.value.trim() === "") {
                alert("দয়া করে নাম এবং মূল্য দুটিই পূরণ করুন!");
                return;
            }
            
            const newProduct = {
                id: Date.now(),
                name: nameInput.value.trim(),
                price: parseInt(priceInput.value),
                img: imgInput.value.trim() || "https://placeholder.com"
            };

            products.push(newProduct);
            nameInput.value = "";
            priceInput.value = "";
            imgInput.value = "";
            renderAdminTable();
        });

        window.deleteProduct = function(index) {
            if(confirm("আপনি কি নিশ্চিতভাবে এই পণ্যটি তালিকা থেকে বাদ দিতে চান?")) {
                products.splice(index, 1);
                renderAdminTable();
            }
        }

        renderAdminTable();
    </script>
</body>
</html>
