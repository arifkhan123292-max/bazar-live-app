<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Bazar - কাস্টমার অর্ডার পেজ</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #f7f9fa; color: #333; }
        .header { background-color: #111; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 20px; }
        .container { max-width: 600px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .product-item { border: 1px solid #ddd; padding: 10px; border-radius: 6px; background: #fff; text-align: center; position: relative; }
        .product-img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .product-name { font-weight: bold; font-size: 15px; margin: 8px 0 4px 0; }
        .product-price { color: #2ecc71; font-weight: bold; margin-bottom: 8px; }
        .btn-order { background: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: 100%; }
        .cart-section { margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .payment-method { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .payment-box { border: 1px solid #ddd; padding: 10px; text-align: center; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .payment-box.active { border-color: #2ecc71; background: #e8f8f0; }
        .whatsapp-btn { background-color: #237ae6; color: white; width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 15px; }
        .total-bill { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 15px 0; padding: 10px; background: #f9f9f9; border-left: 4px solid #2ecc71; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Khan Bazar - আজকের বাজারের তালিকা</h1>
        <div><i class="fas fa-shopping-cart"></i></div>
    </div>

    <div class="container">
        <!-- পণ্য প্রদর্শনের গ্রিড -->
        <div class="product-grid" id="customer-product-list"></div>

        <!-- অর্ডার ফর্ম এবং কার্ট সেকশন -->
        <div class="cart-section">
            <h2><i class="fas fa-shopping-basket"></i> আপনার অর্ডার লিস্ট</h2>
            <div id="cart-items-display" style="margin-bottom: 15px; color: #555;">কোনো পণ্য সিলেক্ট করা হয়নি।</div>
            <div class="total-bill">সর্বমোট বিল: ৳ <span id="total-price-amount">0</span></div>

            <h3><i class="fas fa-truck"></i> ডেলিভারি তথ্য দিন</h3>
            <div class="form-group">
                <label>আপনার নাম:</label>
                <input type="text" id="customer-name" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label>মোবাইল নম্বর:</label>
                <input type="tel" id="customer-phone" placeholder="017XXXXXXXX">
            </div>
            <div class="form-group">
                <label>পূর্ণাঙ্গ ঠিকানা:</label>
                <textarea id="customer-address" rows="3" placeholder="গ্রাম/রোড, থানা, জেলা লিখুন"></textarea>
            </div>

            <h3><i class="fas fa-credit-card"></i> পেমেন্ট মাধ্যম সিলেক্ট করুন</h3>
            <div class="payment-method">
                <div class="payment-box" onclick="selectPayment('বিকাশ')"><i class="fas fa-money-bill-wave" style="color: #d12053;"></i><br>বিকাশ</div>
                <div class="payment-box" onclick="selectPayment('নগদ')"><i class="fas fa-money-bill-wave" style="color: #f6921e;"></i><br>নগদ</div>
                <div class="payment-box" onclick="selectPayment('রকেট')"><i class="fas fa-money-bill-wave" style="color: #8c278f;"></i><br>রকেট</div>
            </div>
            
            <div class="form-group" id="trx-group" style="display:none;">
                <label id="payment-instruction-text">আমাদের নম্বরে সেন্ডমানি করার পর ট্রানজেকশন আইডি (TrxID) দিন:</label>
                <input type="text" id="transaction-id" placeholder="যেমন: 8N73X9WPL">
            </div>

            <button class="whatsapp-btn" onclick="sendOrderToWhatsApp()">
                <i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপে অর্ডার কনফার্ম করুন
            </button>
        </div>
    </div>

<script>
// ২৫টি ডেমো পণ্যের তালিকা (অ্যাডমিন প্যানেল থেকে পরিবর্তন করা যাবে)
const defaultProducts = [
    { id: 1, name: "মিনিকেট চাল (৫ কেজি)", price: 350, img: "https://unsplash.com" },
    { id: 2, name: "সয়াবিন তেল (১ লিটার)", price: 165, img: "https://unsplash.com" },
    { id: 3, name: "প্যারাশুট নারিকেল তেল", price: 85, img: "https://unsplash.com" },
    { id: 4, name: "মসুর ডাল (১ কেজি)", price: 140, img: "https://unsplash.com" },
    { id: 5, name: "চিনি (১ কেজি)", price: 135, img: "https://unsplash.com" }
    // আপনার বাকি পণ্যগুলো লোকাল স্টোরেজে স্বয়ংক্রিয়ভাবে সিঙ্ক হবে
];

let products = JSON.parse(localStorage.getItem('khanBazarProducts')) || defaultProducts;
let selectedCart = {};
let chosenPayment = "";

function displayCustomerProducts() {
    const grid = document.getElementById('customer-product-list');
    grid.innerHTML = "";
    products.forEach(p => {
        grid.innerHTML += `
            <div class="product-item">
                <img src="${p.img}" class="product-img">
                <div class="product-name">${p.name}</div>
                <div class="product-price">৳ ${p.price}</div>
                <button class="btn-order" onclick="addToCart('${p.name}', ${p.price})"><i class="fas fa-plus"></i> যোগ করুন</button>
            </div>
        `;
    });
}

function addToCart(name, price) {
    if (selectedCart[name]) {
        selectedCart[name].qty += 1;
    } else {
        selectedCart[name] = { price: price, qty: 1 };
    }
    updateCartDisplay();
}

function updateCartDisplay() {
    const display = document.getElementById('cart-items-display');
    const totalSpan = document.getElementById('total-price-amount');
    
    if (Object.keys(selectedCart).length === 0) {
        display.innerText = "কোনো পণ্য সিলেক্ট করা হয়নি।";
        totalSpan.innerText = "0";
        return;
    }

    display.innerHTML = "";
    let grandTotal = 0;

    for (let item in selectedCart) {
        let cost = selectedCart[item].price * selectedCart[item].qty;
        grandTotal += cost;
        display.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>${item} (x${selectedCart[item].qty})</span>
            <span>৳ ${cost}</span>
        </div>`;
    }
    totalSpan.innerText = grandTotal;
}

function selectPayment(method) {
    chosenPayment = method;
    document.querySelectorAll('.payment-box').forEach(box => {
        box.classList.remove('active');
        if(box.innerText.includes(method)) box.classList.add('active');
    });
    
    document.getElementById('trx-group').style.display = "block";
    document.getElementById('payment-instruction-text').innerText = `আমাদের পার্সোনাল ${method} নম্বরে (01749672230) সেন্ডমানি করার পর নিচের ঘরে TrxID দিন:`;
}

function sendOrderToWhatsApp() {
    const name = document.getElementById('customer-name').value;
    const phone = document.getElementById('customer-phone').value;
    const address = document.getElementById('customer-address').value;
    const trxId = document.getElementById('transaction-id').value;
    const totalBill = document.getElementById('total-price-amount').innerText;

    if (!name || !phone || !address || !chosenPayment) {
        alert("দয়া করে নাম, মোবাইল নম্বর, ঠিকানা এবং পেমেন্ট মাধ্যম সিলেক্ট করুন!");
        return;
    }

    let productDetails = "";
    for (let item in selectedCart) {
        productDetails += `- ${item} (x${selectedCart[item].qty})\n`;
    }

    // হোয়াটসঅ্যাপে পাঠানোর জন্য মেসেজ তৈরি
    let message = `*নতুন অর্ডার - Khan Bazar*\n\n`;
    message += `*কাস্টমারের নাম:* ${name}\n`;
    message += `*মোবাইল:* ${phone}\n`;
    message += `*ঠিকানা:* ${address}\n\n`;
    message += `*অর্ডারকৃত পণ্যসমূহ:*\n${productDetails}\n`;
    message += `*সর্বমোট বিল:* ৳ ${totalBill}\n`;
    message += `*পেমেন্ট মাধ্যম:* ${chosenPayment}\n`;
    if(trxId) message += `*TrxID:* ${trxId}\n`;

    const whatsappNumber = "8801749672230"; // আপনার দোকানের নাম্বার
    const encodedMessage = encodeURIComponent(message);
    window.open(`https://wa.me{whatsappNumber}?text=${encodedMessage}`, '_blank');
}

window.onload = displayCustomerProducts;
</script>
</body>
</html>
