
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আজকের লাইভ বাজারের মূল্য</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .product-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; position: relative; }
        .badge { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 5px; font-size: 12px; border-radius: 3px; }
        .btn { display: block; width: 100%; background: #4CAF50; color: white; padding: 10px; text-decoration: none; border: none; font-size: 16px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
    
    <!-- হোয়াটসঅ্যাপে অর্ডার পাঠানোর কোড -->
    <script>
    function orderOnWhatsApp(productName, productPrice) {
        let myWhatsAppNumber = "8801700000000"; // ⚠️ এখানে আপনার আসল নম্বরটি বসিয়ে নিতে পারেন
        let message = `*নতুন অর্ডার এসেছে!*%0A%0A📦 *পণ্য:* ${productName}%0A💰 *মূল্য:* ${productPrice}`;
        window.open(`https://wa.me{myWhatsAppNumber}?text=${message}`, '_blank');
    }
    </script>
</head>
<body>

<div class="container">
    <h2>আজকের লাইভ বাজারের মূল্য</h2>
    
    <!-- প্রোডাক্ট ১: ইলিশ মাছ -->
    <div class="product-card">
        <span class="badge">০% ছাড়</span>
        <h3>ইলিশ মাছ (বড়)</h3>
        <p>১ কেজি</p>
        <h4>মূল্য: ৳ ০</h4>
        <button class="btn" onclick="orderOnWhatsApp('ইলিশ মাছ (বড়)', '৳ ০')">কিনুন</button>
    </div>

    <!-- প্রোডাক্ট ২: গরুর মাংস -->
    <div class="product-card">
        <span class="badge">০% ছাড়</span>
        <h3>গরুর মাংস (প্রিমিয়াম)</h3>
        <p>১ কেজি</p>
        <h4>মূল্য: ৳ ০</h4>
        <button class="btn" onclick="orderOnWhatsApp('গরুর মাংস (প্রিমিয়াম)', '৳ ০')">কিনুন</button>
    </div>
    
</div>

</body>
</html>
