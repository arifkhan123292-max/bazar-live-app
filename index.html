<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Bazar - অফার শপ</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #f7f9fa; color: #333; }
        .header { background-color: #111; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { margin: 0; font-size: 20px; }
        .container { max-width: 600px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .product-item { border: 1px solid #ddd; padding: 10px; border-radius: 6px; background: #fff; text-align: center; position: relative; }
        .discount-badge { position: absolute; top: 8px; left: 8px; background: #e74c3c; color: white; padding: 3px 6px; font-size: 11px; font-weight: bold; border-radius: 4px; }
        .product-img { width: 100%; height: 120px; object-fit: cover; border-radius: 4px; }
        .product-name { font-weight: bold; font-size: 15px; margin: 8px 0 4px 0; }
        .old-price { text-decoration: line-through; color: #7f8c8d; font-size: 13px; margin-right: 5px; }
        .product-price { color: #2ecc71; font-weight: bold; font-size: 16px; margin-bottom: 8px; display: inline-block; }
        .btn-order { background: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .cart-section { margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .payment-method { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 15px 0; }
        .payment-box { border: 1px solid #ddd; padding: 10px 5px; text-align: center; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 12px; }
        .payment-box.active { border-color: #2ecc71; background: #e8f8f0; }
        .whatsapp-btn { background-color: #237ae6; color: white; width: 100%; padding: 14px; border: none; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .total-bill { font-size: 18px; font-weight: bold; color: #2c3e50; margin: 15px 0; padding: 10px; background: #f9f9f9; border-left: 4px solid #2ecc71; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Khan Bazar - ধামাকা অফার শপ</h1>
        <div><i class="fas fa-shopping-cart"></i></div>
    </div>

    <div class="container">
        <div class="product-grid" id="customer-product-list"></div>

        <div class="cart-section">
            <h2><i class="fas fa-shopping-basket"></i> আপনার অফার কার্ট</h2>
            <div id="cart-items-display" style="margin-bottom: 15px; color: #555;">কোনো পণ্য সিলেক্ট করা হয়নি।</div>
            <div class="total-bill">সর্বমোট অফার বিল: ৳ <span id="total-price-amount">0</span></div>

            <h3><i class="fas fa-truck"></i> Delivery Information</h3>
            <div class="form-group">
                <label>আপনার নাম:</label>
                <input type="text" id="customer-name" placeholder="আপনার নাম লিখুন">
            </div>
            <div class="form-group">
                <label>মোবাইল নম্বর:</label>
                <input type="tel" id="customer-phone" placeholder="017XXXXXXXX">
            </div>
            <div class="form-group">
                <label>পূর্ণাঙ্গ ঠিকানা:</label>
                <textarea id="customer-address" rows="3" placeholder="গ্রাম/রোড, থানা, জেলা লিখুন"></textarea>
            </div>

            <h3><i class="fas fa-credit-card"></i> পেমেন্ট মাধ্যম সিলেক্ট করুন</h3>
            <div class="payment-method">
                <div class="payment-box" onclick="selectPayment('বিকাশ')">বিকাশ</div>
                <div class="payment-box" onclick="selectPayment('নগদ')">নগদ</div>
                <div class="payment-box" onclick="selectPayment('রকেট')">রকেট</div>
                <div class="payment-box" onclick="selectPayment('ক্যাশ অন ডেলিভারি')">ক্যাশ অন<br>ডেলিভারি</div>
            </div>
            
            <div class="form-group" id="trx-group" style="display:none;">
                <label id="payment-instruction-text">ট্রানজেকশন আইডি (TrxID) দিন:</label>
                <input type="text" id="transaction-id" placeholder="যেমন: 8N73X9WPL">
            </div>

            <button class="whatsapp-btn" onclick="sendOrderToWhatsApp()">
                <i class="fab fa-whatsapp"></i> হোয়াটসঅ্যাপে অফারটি লুফে নিন
            </button>
        </div>
    </div>

<script>
const defaultProducts = [
    { id: 1, name: "মিনিকেট চাল (৫ কেজি)", price: 350, discount: 10, img: "https://unsplash.com" },
    { id: 2, name: "সয়াবিন তেল (১ লিটার)", price: 165, discount: 5, img: "https://unsplash.com" }
];

let products = JSON.parse(localStorage.getItem('khanBazarProducts')) || defaultProducts;
let selectedCart = {};
let chosenPayment = "";

function displayCustomerProducts() {
    const grid = document.getElementById('customer-product-list');
    grid.innerHTML = "";
    products.forEach(p => {
        let disc = p.discount || 0;
        let finalPrice = Math.round(p.price - (p.price * (disc / 100)));
        
        let badgeHtml = disc > 0 ? `<div class="discount-badge">${disc}% ছাড়</div>` : '';
        let priceHtml = disc > 0 ? `<span class="old-price">৳${p.price}</span><span class="product-price">৳${finalPrice}</span>` : `<span class="product-price">৳${p.price}</span>`;

        grid.innerHTML += `
            <div class="product-item">
                ${badgeHtml}
                <img src="${p.img}" class="product-img" onerror="this.src='https://unsplash.com'">
                <div class="product-name">${p.name}</div>
                <div>${priceHtml}</div>
                <button class="btn-order" onclick="addToCart('${p.name}', ${finalPrice})"><i class="fas fa-plus"></i> যোগ করুন</button>
            </div>
        `;
    });
}

function addToCart(name, price) {
    if (selectedCart[name]) {
        selectedCart[name].qty += 1;
    } else {
        selectedCart[name] = { price: price, qty: 1 };
    }
    updateCartDisplay();
}

function updateCartDisplay() {
    const display = document.getElementById('cart-items-display');
    const totalSpan = document.getElementById('total-price-amount');
    
    if (Object.keys(selectedCart).length === 0) {
        display.innerText = "কোনോ পণ্য সিলেক্ট করা হয়নি।";
        totalSpan.innerText = "0";
        return;
    }

    display.innerHTML = "";
    let grandTotal = 0;

    for (let item in selectedCart) {
        let cost = selectedCart[item].price * selectedCart[item].qty;
        grandTotal += cost;
        display.innerHTML += `<div style="display:flex; justify-content:space-between; margin-bottom:5px;">
            <span>${item} (x${selectedCart[item].qty})</span>
            <span>৳ ${cost}</span>
        </div>`;
    }
    totalSpan.innerText = grandTotal;
}

function selectPayment(method) {
    chosenPayment = method;
    document.querySelectorAll('.payment-box').forEach(box => {
        box.classList.remove('active');
        if(box.innerText.includes(method)) box.classList.add('active');
    });
    
    if (method === 'ক্যাশ অন ডেলিভারি') {
        document.getElementById('trx-group').style.display = "none";
        document.getElementById('transaction-id').value = "";
    } else {
        document.getElementById('trx-group').style.display = "block";
        document.getElementById('payment-instruction-text').innerText = `আমাদের ${method} নম্বরে (01749672230) সেন্ডমানি করে TrxID দিন:`;
    }
}

function sendOrderToWhatsApp() {
    const name = document.getElementById('customer-name').value;
    const phone = document.getElementById('customer-phone').value;
    const address = document.getElementById('customer-address').value;
    const trxId = document.getElementById('transaction-id').value;
    const totalBill = document.getElementById('total-price-amount').innerText;

    if (!name || !phone || !address || !chosenPayment) {
        alert("দয়া করে সম্পূর্ণ তথ্য পূরণ করুন!");
        return;
    }

    let productDetails = "";
    for (let item in selectedCart) {
        productDetails += `- ${item} (x${selectedCart[item].qty})\n`;
    }

    let message = `*নতুন অফার অর্ডার - Khan Bazar*\n\n`;
    message += `*নাম:* ${name}\n*মোবাইল:* ${phone}\n*ঠিকানা:* ${address}\n\n`;
    message += `*পণ্যসমূহ:*\n${productDetails}\n`;
    message += `*সর্বমোট অফার বিল:* ৳ ${totalBill}\n`;
    message += `*পেমেন্ট:* ${chosenPayment}\n`;
    if(trxId && chosenPayment !== 'ক্যাশ On ডেলিভারি') message += `*TrxID:* ${trxId}\n`;

    const whatsappNumber = "8801749672230"; // আপনার নিজের আসল নাম্বার পারফেক্টলি বসানো হয়েছে
    window.open(`https://wa.me{whatsappNumber}?text=${encodeURIComponent(message)}`, '_blank');
}

window.onload = displayCustomerProducts;
</script>
</body>
</html>
