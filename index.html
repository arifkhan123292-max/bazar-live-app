    function loadProducts() {
        const tableBody = document.getElementById("productTableBody");
        tableBody.innerHTML = "";
        
        products.forEach(product => {
            let encodedText = encodeURIComponent(`*নতুন বাজার অর্ডার!*\n\n📦 *পণ্যের নাম:* ${product.name}\n💰 *মূল্য:* ${product.price}\n\nদয়া করে অর্ডারটি কনফার্ম করুন।`);
            let whatsappUrl = `https://wa.me{myWhatsAppNumber}?text=${encodedText}`;

            let row = `<tr>
                <td><strong>${product.name}</strong></td>
                <td class="price">${product.price}</td>
                <td style="text-align: center;"><a href="${whatsappUrl}" target="_blank" class="buy-btn">কিনুন</a></td>
            </tr>`;
            tableBody.innerHTML += row;
        });
    }
