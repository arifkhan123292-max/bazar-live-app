        function loadAdminPanel() {
            const container = document.getElementById('admin-container');
            container.innerHTML = '';
            products.forEach(p => {
                const row = document.createElement('div');
                row.className = 'product-row';
                const currentPrice = localStorage.getItem(p.id + '_price') || '';
                const currentDiscount = localStorage.getItem(p.id + '_discount') || '';
                row.innerHTML = `
                    <div class="product-name">${p.name}</div>
                    <input type="number" id="${p.id}_p" placeholder="দাম" value="${currentPrice}">
                    <input type="number" id="${p.id}_d" placeholder="%" value="${currentDiscount}">
                `;
                container.appendChild(row);
            });
        }

        function saveAllPrices() {
            products.forEach(p => {
                const priceVal = document.getElementById(p.id + '_p').value;
                const discountVal = document.getElementById(p.id + '_d').value;
                if(priceVal) localStorage.setItem(p.id + '_price', priceVal);
                if(discountVal) localStorage.setItem(p.id + '_discount', discountVal);
            });
            alert('১০০টি আইটেমের বাজার দর সফলভাবে আপডেট করা হয়েছে!');
            window.location.href = 'index.html';
        }
        window.onload = loadAdminPanel;
