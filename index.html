<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আজকের লাইভ বাজার</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .product-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .btn { display: block; width: 100%; background: #4CAF50; color: white; padding: 12px; text-decoration: none; border: none; font-size: 16px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; box-sizing: border-box; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>আজকের লাইভ বাজার</h2>
    
    <div class="product-card">
        <h3>ইলিশ মাছ (বড়)</h3>
        <p>পরিমাণ: ১ কেজি</p>
        <h4>মূল্য: ৳ ৯০০</h4>
        <a href="https://wa.me" target="_blank" class="btn">হোয়াটসঅ্যাপে কিনুন</a>
    </div>

    <div class="product-card">
        <h3>গরুর মাংস (প্রিমিয়াম)</h3>
        <p>পরিমাণ: ১ কেজি</p>
        <h4>মূল্য: ৳ ৭৫০</h4>
        <a href="https://wa.me" target="_blank" class="btn">হোয়াটসঅ্যাপে কিনুন</a>
    </div>
</div>

</body>
</html>
