    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f4; padding: 10px; margin: 0; }
        .header { background: #4CAF50; color: white; padding: 15px; border-radius: 0 0 15px 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .filter-container { margin: 15px auto; max-width: 600px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
        .filter-btn { background: #fff; border: 1px solid #4CAF50; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #4CAF50; font-size: 13px; }
        .filter-btn.active { background: #4CAF50; color: #fff; }
        .container { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        @media (max-width: 400px) { .container { grid-template-columns: 1fr; } }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 10px; position: relative; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .badge { position: absolute; top: 8px; right: 8px; background: red; color: white; padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: bold; }
        .price { color: #e44d26; font-size: 16px; font-weight: bold; margin: 8px 0; }
        .unit { color: #777; font-size: 13px; }
        .icon { font-size: 30px; margin-bottom: 5px; }
        .btn { background: #25D366; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; font-size: 14px; margin-top: 5px; width: 80%; font-weight: bold; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 20% auto; padding: 20px; border-radius: 10px; width: 80%; max-width: 400px; text-align: left; }
        .modal-content h3 { margin-top: 0; color: #4CAF50; }
        .modal-content input { width: 95%; padding: 8px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .modal-btn { background: #25D366; color: white; padding: 10px; border: none; border-radius: 5px; width: 100%; font-weight: bold; cursor: pointer; }
        .close-btn { float: right; font-size: 20px; cursor: pointer; font-weight: bold; color: #aaa; }
    </style>
</head>
