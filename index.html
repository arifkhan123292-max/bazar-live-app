<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান বাজার - হোম পেজ</title>
    <!-- সুন্দর বাংলা ফন্টের জন্য গুগল ফন্ট -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        header { background-color: #1a252f; color: white; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .product-card h3 { font-size: 18px; margin: 10px 0; color: #2c3e50; }
        .product-card p { font-size: 16px; color: #27ae60; font-weight: bold; margin-bottom: 15px; }
        .btn-add { background-color: #2ecc71; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        .btn-add:hover { background-color: #27ae60; }
        .cart-section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); height: fit-content; }
        .cart-section h2 { font-size: 20px; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .cart-item { display: flex; justify-content: space-between; margin-bottom: 10px; padding-bottom: 5px; border-bottom: 1px dashed #eee; font-size: 14px; }
        .cart-total { font-size: 18px; font-weight: bold; margin-top: 15px; text-align: right; color: #c0392b; }
        .btn-checkout { background-color: #e67e22; color: white; border: none; padding: 12px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .nav-link { display: inline-block; margin-top: 10px; color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>খান বাজার - অনলাইন মুদি দোকান</h1>
    <a href="admin.html" class="nav-link" style="color: #ecc94b;">এডমিন প্যানেলে যান ⚙️</a>
</header>

<div class="container">
    <!-- পণ্য তালিকা -->
    <div class="product-grid" id="productGrid"></div>

    <!-- কার্ট / ব্যাগ সেকশন -->
    <div class="cart-section">
        <h2>আপনার ব্যাগ 🛒</h2>
        <div id="cartItems"></div>
        <div class="cart-total" id="cartTotal">সর্বমোট: ৳ 0</div>
        <button class="btn-checkout" onclick="checkout()">অর্ডার সম্পন্ন করুন</button>
    </div>
</div>

<script>
// প্রাথমিক মুদি পণ্যের লিস্ট (যদি লোকাল স্টোরেজে কিছু না থাকে)
const defaultProducts = [
    { id: 1, name: "মিনিকেট চাল (১ কেজি)", price: 68 },
    { id: 2, name: "মসুর ডাল (১ কেজি)", price: 130 },
    { id: 3, name: "সয়াবিন তেল (১ লিটার)", price: 165 },
    { id: 4, name: "প্যাকেট চিনি (১ কেজি)", price: 135 },
    { id: 5, name: "আটা (২ কেজি প্যাকেট)", price: 110 },
    { id: 6, name: "আয়োডিনযুক্ত লবণ (১ কেজি)", price: 42 }
];

// লোড প্রোডাক্টস
let products = JSON.parse(localStorage.getItem('grocery_products'));
if (!products) {
    products = defaultProducts;
    localStorage.setItem('grocery_products', JSON.stringify(products));
}

let cart = [];

// প্রোডাক্ট পেজে দেখানো
function displayProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = '';
    products.forEach(product => {
        grid.innerHTML += `
            <div class="product-card">
                <div>
                    <div style="font-size: 40px; margin-bottom:10px;">📦</div>
                    <h3>${product.name}</h3>
                </div>
                <div>
                    <p>৳ ${product.price}</p>
                    <button class="btn-add" onclick="addToCart(${product.id})">ব্যাগে রাখুন</button>
                </div>
            </div>
        `;
    });
}

// কার্টে পণ্য যোগ করা
function addToCart(id) {
    const product = products.find(p => p.id === id);
    const cartItem = cart.find(item => item.id === id);
    
    if (cartItem) {
        cartItem.quantity++;
    } else {
        cart.push({ ...product, quantity: 1 });
    }
    updateCart();
}

// কার্ট আপডেট করা
function updateCart() {
    const cartItemsDiv = document.getElementById('cartItems');
    const totalDiv = document.getElementById('cartTotal');
    cartItemsDiv.innerHTML = '';
    
    let total = 0;
    
    if (cart.length === 0) {
        cartItemsDiv.innerHTML = '<p style="color:#7f8c8d; text-align:center;">ব্যাগ খালি আছে</p>';
    } else {
        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;
            cartItemsDiv.innerHTML += `
                <div class="cart-item">
                    <span>${item.name} (x${item.quantity})</span>
                    <span>৳ ${itemTotal}</span>
                </div>
            `;
        });
    }
    totalDiv.innerText = `সর্বমোট: ৳ ${total}`;
}

function checkout() {
    if(cart.length === 0) {
        alert("আপনার ব্যাগ খালি! আগে পণ্য যোগ করুন।");
        return;
    }
    alert("আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে! ধন্যবাদ।");
    cart = [];
    updateCart();
}

// প্রথমবার পেজ লোড হলে রান হবে
displayProducts();
</script>

</body>
</html>
