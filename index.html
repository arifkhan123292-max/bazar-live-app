<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Bazar - আজকের লাইভ বাজার তালিকা</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #f7f9fa; color: #333; }
        .header { background-color: #111; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .header h1 { margin: 0; font-size: 20px; }
        .star-icon { color: #2ecc71; font-size: 24px; }
        .container { max-width: 600px; margin: 20px auto; padding: 15px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .info-section { margin-bottom: 20px; }
        .info-title { color: #e67e22; font-weight: bold; margin-bottom: 15px; display: flex; align-items: center; gap: 5px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #555; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        
        .search-box { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; }

        /* প্রোডাক্ট আইটেম ডিজাইন */
        .cart-section { margin-top: 20px; }
        .product-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px dashed #ddd; border-radius: 4px; margin-bottom: 5px; transition: background 0.2s; }
        .product-info { display: flex; align-items: center; gap: 12px; }
        .product-img { width: 45px; height: 45px; border-radius: 6px; object-fit: cover; background-color: #eee; border: 1px solid #ddd; }
        .product-details { display: flex; flex-direction: column; }
        .product-name { font-weight: 500; font-size: 16px; color: #2c3e50; }
        .product-price { color: #7f8c8d; font-size: 14px; margin-top: 2px; }
        
        /* প্লাস-মাইনাস ও কোয়ান্টিটি কন্ট্রোল */
        .quantity-control { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 32px; height: 32px; border: 1px solid #ccc; background: white; border-radius: 4px; font-weight: bold; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .qty-btn:hover { background: #f1f2f6; border-color: #999; }
        .qty-btn.plus:hover { background: #e8f8f0; border-color: #2ecc71; color: #2ecc71; }
        .qty-text { font-size: 16px; font-weight: bold; min-width: 20px; text-align: center; }
        
        .product-item.active-item { background-color: #e8f8f0; border-left: 4px solid #2ecc71; }

        .cart-summary { margin-top: 20px; padding: 15px; background-color: #2c3e50; color: white; border-radius: 8px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
        .total-bill { font-weight: bold; font-size: 18px; color: #2ecc71; }
        
        .whatsapp-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            margin-top: 15px;
            text-decoration: none;
            box-sizing: border-box;
        }
        .whatsapp-btn:hover { background-color: #27ae60; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Khan Bazar</h1>
        <div class="star-icon"><i class="fas fa-star"></i></div>
    </div>

    <div class="container">
        <div class="info-section">
            <div class="info-title"><i class="fas fa-map-marker-alt"></i> ডেলিভারি ঠিকানা ও তথ্য দিন:</div>
            
            <div class="form-group">
                <label for="customer-name">আপনার নাম:</label>
                <input type="text" id="customer-name" placeholder="যেমন: আরিф খান">
            </div>
            
            <div class="form-group">
                <label for="customer-phone">মোবাইল নম্বর:</label>
                <input type="tel" id="customer-phone" placeholder="যেমন: 017XXXXXXXX">
            </div>
            
            <div class="form-group">
                <label for="customer-address">পূর্ণাঙ্গ ঠিকানা:</label>
                <textarea id="customer-address" rows="3" placeholder="যেমন: বাসা নং ৪, রোড নং ২, মিরপুর, ঢাকা"></textarea>
            </div>
        </div>

        <div class="cart-section">
            <div class="info-title"><i class="fas fa-list"></i> আইটেম বা পণ্যের নাম ও মূল্য</div>
            
            <input type="text" id="search-input" class="search-box" placeholder="🔍 পণ্য খুঁজুন...">

            <div id="cart-items-container"></div>

            <div class="cart-summary">
                <span>🛒 মোট কার্ট বিল:</span>
                <span><span class="total-bill" id="total-bill-amount">0</span> টাকা</span>
            </div>
            
            <a href="#" id="send-whatsapp-btn" class="whatsapp-btn">
                <i class="fab fa-whatsapp" style="font-size: 20px;"></i> হোয়াটসঅ্যাপে অর্ডার পাঠান
            </a>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, name: "মিনিকেট চাল (৫ কেজি)", price: 350, img: "https://unsplash.com" },
            { id: 2, name: "সয়াবিন তেল (১ লিটার)", price: 165, img: "https://unsplash.com" },
            { id: 3, name: "নাজিরশাইল চাল (১ কেজি)", price: 85, img: "https://unsplash.com" },

            { id: 12, name: "হলুদ গুঁড়া (২০০ গ্রাম)", price: 80, img: "https://unsplash.com" },
            { id: 13, name: "মরিচ গুঁড়া (২০০ গ্রাম)", price: 95, img: "https://unsplash.com" },
            { id: 14, name: "সরিষার তেল (৫০০ মিলি)", price: 120, img: "https://unsplash.com" },

            { id: 23, name: "খেজুরি গুড় (১ কেজি)", price: 180, img: "https://unsplash.com" },
            { id: 24, name: "পোলাও চাল (১ কেজি)", price: 150, img: "https://unsplash.com" },
            { id: 25, name: "ঘি (২৫০ গ্রাম)", price: 320, img: "https://unsplash.com" }
        ];

        let products = JSON.parse(localStorage.getItem('bazar_products'));
        if (!products || products.length === 0) {
            products = defaultProducts;
            localStorage.setItem('bazar_products', JSON.stringify(defaultProducts));
        }

        let cartQuantities = {};
        const container = document.getElementById('cart-items-container');

        function updateBill() {
            let totalBill = 0;
            products.forEach(p => {
                const qty = cartQuantities[p.id] || 0;
                totalBill += p.price * qty;
            });
            document.getElementById('total-bill-amount').innerText = totalBill;
        }

        function displayProducts(productsToRender) {
