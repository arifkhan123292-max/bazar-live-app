    <!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আজকের লাইভ বাজার</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 10px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .product-table th, .product-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }
        .product-table th {
            background-color: #34495e;
            color: white;
        }
        .price {
            color: #e74c3c;
            font-weight: bold;
        }
        .buy-btn {
            background-color: #25D366;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            font-weight: bold;
            font-size: 14px;
        }
        .buy-btn:hover {
            background-color: #1ebd58;
        }
        #noResult {
            display: none;
            text-align: center;
            color: #7f8c8d;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛒 আজকের লাইভ বাজার তালিকা</h2>
    
    <input type="text" id="searchInput" class="search-box" placeholder="প্রয়োজনীয় পণ্যটি খুঁজে পেতে নিচে সার্চ করুন...">
    
    <table class="product-table">
        <thead>
            <tr>
                <th>আইটেম বা পণ্যের নাম</th>
                <th>মূল্য</th>
                <th style="text-align: center;">অ্যাকশন</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
            <!-- পণ্য এখানে অটো বসবে -->
        </tbody>
    </table>
    
    <div id="noResult">দুঃখিত, এই নামের কোনো পণ্য খুঁজে পাওয়া যায়নি!</div>
</div>

<script>
    const myWhatsAppNumber = "8801700000000"; 

    const products = [
        { name: "মিনিকেট চাল (১ কেজি)", price: 70 },
        { name: "নাজিরশাইল চাল (১ কেজি)", price: 85 },
        { name: "মসুর ডাল বড় দানা (১ কেজি)", price: 110 },
        { name: "সয়াবিন তেল (১ লিটার বোতল)", price: 165 },
        { name: "খাঁটি সরিষার তেল (১ লিটার)", price: 280 },
        { name: "দেশি পেঁয়াজ (১ কেজি)", price: 90 },
        { name: "দেশি রসুন (১ কেজি)", price: 220 },
        { name: "দেশি আলু (১ কেজি)", price: 55 },
        { name: "লাল টমেটো (১ কেজি)", price: 80 },
        { name: "কাঁচামরিচ (১ কেজি)", price: 120 },
        { name: "প্যাকেট লবণ (১ কেজি)", price: 42 },
        { name: "গুঁড়ো দুধ ডানো (৪০০ গ্রাম)", price: 410 }
    ];

    function displayProducts() {
        const tableBody = document.getElementById("productTableBody");
        tableBody.innerHTML = "";

        products.forEach(product => {
            let messageText = `🛒 *নতুন লাইভ বাজার অর্ডার*\n\n📦 *পণ্যের নাম:* ${product.name}\n💵 *মূল্য:* ${product.price} টাকা\n\nঅর্ডারটি নিশ্চিত করতে চাচ্ছি। ধন্যবাদ!`;
            let encodedText = encodeURIComponent(messageText);
            let whatsappUrl = `https://wa.me{myWhatsAppNumber}?text=${encodedText}`;

            let row = `<tr>
                <td><strong>${product.name}</strong></td>
                <td class="price">${product.price} ৳</td>
                <td style="text-align: center;">
                    <a href="${whatsappUrl}" target="_blank" class="buy-btn">💬 অর্ডার করুন</a>
                </td>
            </tr>`;
            
            tableBody.innerHTML += row;
        });
    }

    function filterProducts() {
        let input = document.getElementById("searchInput").value.toUpperCase();
        let tableBody = document.getElementById("productTableBody");
        let rows = tableBody.getElementsByTagName("tr");
        let noResult = document.getElementById("noResult");
        let hasMatch = false;

        for (let i = 0; i < rows.length; i++) {
            let productNameTd = rows[i].getElementsByTagName("td")[0];
            if (productNameTd) {
                let productName = productNameTd.innerText || productNameTd.textContent;
                if (productName.toUpperCase().indexOf(input) > -1) {
                    rows[i].style.display = "";
                    hasMatch = true;
                } else {
                    rows[i].style.display = "none";
                }
            }
        }

        if (hasMatch) {
            noResult.style.display = "none";
        } else {
            noResult.style.display = "block";
        }
    }

    document.getElementById("searchInput").addEventListener("keyup", filterProducts);
    displayProducts();
</script>

</body>
</html>
