 
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আজকের লাইভ বাজার</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 10px;
        }
        .form-section {
            background: #fdfefe;
            border: 1px solid #dcdde1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-section h3 {
            margin-top: 0;
            color: #2f3640;
            font-size: 16px;
            border-bottom: 2px solid #2ecc71;
            padding-bottom: 5px;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-input {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
        }
        .form-input:focus {
            border-color: #2ecc71;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 2px solid #2ecc71;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        .product-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .product-table th, .product-table td {
            padding: 12px 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
            vertical-align: middle;
        }
        .product-table th {
            background-color: #34495e;
            color: white;
            font-weight: bold;
        }
        .price {
            color: #e74c3c;
            font-weight: bold;
            white-space: nowrap;
        }
        /* কার্ট বাটনের নতুন ডিজাইন */
        .qty-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 5px 10px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin: 0 5px;
        }
        .qty-text {
            font-weight: bold;
            font-size: 16px;
            display: inline-block;
            min-width: 20px;
            text-align: center;
        }
        .add-cart-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        /* ফুটারে টোটাল বিল ও মেইন অর্ডার বাটনের ডিজাইন */
        .cart-summary {
            margin-top: 20px;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            border-radius: 8px;
            text-align: center;
        }
        .total-bill {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .submit-order-btn {
            background-color: #25D366;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .submit-order-btn:hover {
            background-color: #1ebd58;
        }
        #noResult {
            display: none;
            text-align: center;
            color: #7f8c8d;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛒 আজকের লাইভ বাজার তালিকা</h2>
    
    <!-- ডেলিভারি ফর্ম -->
    <div class="form-section">
        <h3>📍 ডেলিভারি ঠিকানা ও তথ্য দিন:</h3>
        <div class="input-group">
            <label for="custName">আপনার নাম:</label>
            <input type="text" id="custName" class="form-input" placeholder="যেমন: আরিফ খান">
        </div>
        <div class="input-group">
            <label for="custPhone">মোবাইল নম্বর:</label>
            <input type="tel" id="custPhone" class="form-input" placeholder="যেমন: 017XXXXXXXX">
        </div>
        <div class="input-group">
            <label for="custAddress">পূর্ণাঙ্গ ঠিকানা:</label>
            <input type="text" id="custAddress" class="form-input" placeholder="যেমন: বাসা নং ৪, রোড নং ২, মিরপুর, ঢাকা">
        </div>
    </div>
    
    <input type="text" id="searchInput" class="search-box" placeholder="প্রয়োজনীয় পণ্যটি খুঁজে পেতে নিচে সার্চ করুন...">
    
    <table class="product-table">
        <thead>
            <tr>
                <th>আইটেম বা পণ্যের নাম</th>
                <th>মূল্য</th>
                <th style="text-align: center;">অ্যাকশন</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
            <!-- পণ্য এখানে অটো বসবে -->
        </tbody>
    </table>
    
    <div id="noResult">দুঃখিত, এই নামের কোনো পণ্য খুঁজে পাওয়া যায়নি!</div>

    <!-- কার্ট সামারি ও মেইন অর্ডার বাটন -->
    <div class="cart-summary">
        <div class="total-bill">🛒 মোট কার্ট বিল: <span id="totalBillAmount">0</span> ৳</div>
        <button onclick="sendFullOrderToWhatsApp()" class="submit-order-btn">💬 হোয়াটসঅ্যাপে সম্পূর্ণ অর্ডার পাঠান</button>
    </div>
</div>

<script>
    const myWhatsAppNumber = "8801700000000"; 

    // পণ্যের তালিকা (সাথে পরিমাণ বা quantity ট্র্যাক করার ব্যবস্থা রাখা হয়েছে)
    const products = [
        { name: "مিনিকেট চাল (১ কেজি)", price: 70, quantity: 0 },
        { name: "নাজিরশাইল চাল (১ কেজি)", price: 85, quantity: 0 },
        { name: "মসুর ডাল বড় দানা (১ কেজি)", price: 110, quantity: 0 },
        { name: "সয়াবিন তেল (১ লিটার বোতল)", price: 165, quantity: 0 },
        { name: "খাঁটি সরিষার তেল (১ লিটার)", price: 280, quantity: 0 }
    ];

    function displayProducts() {
        const tableBody = document.getElementById("productTableBody");
        tableBody.innerHTML = "";

        products.forEach((product, index) => {
            let actionHtml = '';
            
            // যদি পরিমাণ ০ হয় তবে "যোগ করুন" বাটন দেখাবে, আর বেশি হলে +/- বাটন দেখাবে
            if (product.quantity === 0) {
                actionHtml = `<button onclick="updateQty(${index}, 1)" class="add-cart-btn">যোগ করুন</button>`;
            } else {
                actionHtml = `
                    <button onclick="updateQty(${index}, -1)" class="qty-btn">-</button>
                    <span class="qty-text">${product.quantity}</span>
                    <button onclick="updateQty(${index}, 1)" class="qty-btn">+</button>
                `;
            }

            let row = `<tr>
                <td><strong>${product.name}</strong></td>
                <td class="price">${product.price} ৳</td>
                <td style="text-align: center;">${actionHtml}</td>
            </tr>`;
            
            tableBody.innerHTML += row;
        });

        calculateTotal();
    }

    // প্লাস মাইনাস বাটনের কাজ হ্যান্ডেল করার ফাংশন
    function updateQty(index, change) {
        products[index].quantity += change;
        if (products[index].quantity < 0) products[index].quantity = 0;
        displayProducts();
    }

    // মোট বিল হিসাব করার ফাংশন
    function calculateTotal() {
        let total = 0;
        products.forEach(product => {
            total += product.price * product.quantity;
        });
        document.getElementById("totalBillAmount").innerText = total;
    }

    // হোয়াটসঅ্যাপে সম্পূর্ণ অর্ডার লিস্ট পাঠানোর মূল ফাংশন
    function sendFullOrderToWhatsApp() {
        const name = document.getElementById("custName").value.trim();
        const phone = document.getElementById("custPhone").value.trim();
        const address = document.getElementById("custAddress").value.trim();

        if (name === "" || phone === "" || address === "") {
            alert("অনুগ্রহ করে আপনার নাম, মোবাইল নম্বর এবং সম্পূর্ণ ঠিকানা লিখুন!");
            return;
        }

        // কার্ট থেকে শুধু সিলেক্ট করা পণ্যগুলো আলাদা করা
        let selectedProducts = products.filter(p => p.quantity > 0);

        if (selectedProducts.length === 0) {
            alert("আপনার কার্ট খালি! অনুগ্রহ করে প্রথমে পণ্য 'যোগ করুন'।");
            return;
        }

        // মেসেজ টেক্সট সুন্দরভাবে সাজানো
        let messageText = `🛒 *নতুন লাইভ বাজার অর্ডার* 🛒\n\n`;
        messageText += `👤 *কাস্টমারের নাম:* ${name}\n`;
        messageText += `📞 *মোবাইল নম্বর:* ${phone}\n`;
        messageText += `📍 *ডেলিভারি ঠিকানা:* ${address}\n\n`;
        messageText += `📦 *পণ্যের তালিকা:*\n`;

        let totalBill = 0;
        selectedProducts.forEach((product, i) => {
            let itemTotal = product.price * product.quantity;
            totalBill += itemTotal;
            messageText += `${i + 1}. ${product.name} - ${product.quantity}টি x ${product.price}৳ = ${itemTotal}৳\n`;
        });

        messageText += `\n💵 *সর্বমোট বিল:* ${totalBill} টাকা\n\n`;
        messageText += `অর্ডারটি দ্রুত নিশ্চিত করার অনুরোধ রইলো। ধন্যবাদ!`;

        let encodedText = encodeURIComponent(messageText);
        let whatsappUrl = `https://wa.me{myWhatsAppNumber}?text=${encodedText}`;

        window.open(whatsappUrl, '_blank');
    }

    function filterProducts() {
