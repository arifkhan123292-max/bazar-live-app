<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আজকের লাইভ বাজার তালিকা</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 10px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px dashed #cccccc; }
        .header h2 { color: #2c3e50; font-size: 22px; }
        .form-box { border: 1px solid #2ecc71; border-radius: 8px; padding: 15px; margin-bottom: 20px; background-color: #fbfcfc; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: bold; font-size: 14px; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cccccc; border-radius: 5px; font-size: 14px; }
        .form-group textarea { height: 60px; resize: vertical; }
        .table-header { background-color: #2c3e50; color: white; display: flex; padding: 10px; border-radius: 4px; font-weight: bold; font-size: 15px; margin-bottom: 10px; }
        .product-row { display: flex; align-items: center; padding: 12px 10px; border-bottom: 1px solid #ededed; font-size: 15px; }
        .col-name { flex: 2; font-weight: bold; color: #222; text-align: left; }
        .col-price { flex: 1.2; text-align: center; font-weight: bold; color: #e74c3c; }
        .col-action { flex: 1.2; text-align: right; }
        .order-btn { background-color: #2ecc71; color: white; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; width: 100%; text-align: center; }
        .order-btn.added { background-color: #e67e22; }
        .cart-summary { margin-top: 20px; padding: 15px; background-color: #2c3e50; color: white; border-radius: 8px; text-align: center; }
        .total-bill { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
        .whatsapp-btn { background-color: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 5px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header"><h2>🛒 আজকের লাইভ বাজার তালিকা</h2></div>
    <div class="form-box" id="formContainer">
        <div style="color: #d35400; font-weight: bold; margin-bottom: 12px;">📍 ডেলিভারি ঠিকানা ও তথ্য দিন:</div>
        <form id="orderForm">
            <div class="form-group"><label>আপনার নাম:</label><input type="text" id="userName" placeholder="যেমন: আরিফ খান" required></div>
            <div class="form-group"><label>মোবাইল নম্বর:</label><input type="tel" id="userMobile" placeholder="যেমন: 017XXXXXXXX" pattern="[0-9]{11}" required></div>
            <div class="form-group"><label>পূর্ণাঙ্গ ঠিকানা:</label><textarea id="userAddress" placeholder="যেমন: বাসা নং ৪, রোড নং ২, মিরপুর, ঢাকা" required></textarea></div>
        </form>
    </div>
    <div class="table-header"><div class="col-name">পণ্যের নাম</div><div class="col-price">মূল্য</div><div class="col-action">অ্যাকশন</div></div>
    <div id="customerProductList"></div>
    <div class="cart-summary">
        <div class="total-bill">🛒 মোট কার্ট বিল: <span id="totalBillAmount">0</span> ৳</div>
        <button class="whatsapp-btn" onclick="sendToWhatsApp()">💬 হোয়াটস্অ্যাপে সম্পূর্ণ অর্ডার পাঠান</button>
    </div>
</div>
<script>
    const products = [
        { id: "p1", name: "মিনিকেট চাল", price: 70 },
        { id: "p2", name: "নাজিরশাইল চাল", price: 85 },
        { id: "p3", name: "মসুর ডাল বড় দানা", price: 110 },
        { id: "p4", name: "সয়াবিন তেল (১ লিটার)", price: 165 },
        { id: "p5", name: "খাঁটি সরিষার তেল", price: 280 }
    ];
    let cart = {};
    function loadCustomerPanel() {
        const container = document.getElementById('customerProductList');
        let htmlContent = "";
        products.forEach(product => {
            htmlContent += `
            <div class="product-row">
                <div class="col-name">${product.name}</div>
                <div class="col-price">${product.price} ৳</div>
                <div class="col-action"><button class="order-btn" id="btn-${product.id}" onclick="toggleCart('${product.id}', '${product.name}', ${product.price})">অর্ডার</button></div>
            </div>`;
        });
        container.innerHTML = htmlContent;
    }
    function toggleCart(id, name, price) {
        const btn = document.getElementById(`btn-${id}`);
        if (cart[id]) { delete cart[id]; btn.innerText = "অর্ডার"; btn.classList.remove('added'); }
        else { cart[id] = { name: name, price: price }; btn.innerText = "যোগ হয়েছে"; btn.classList.add('added'); }
        calculateTotal();
    }
    function calculateTotal() {
        let total = 0; for (let id in cart) { total += cart[id].price; }
        document.getElementById('totalBillAmount').innerText = total;
    }
    function sendToWhatsApp() {
        const name = document.getElementById('userName').value;
        const mobile = document.getElementById('userMobile').value;
        const address = document.getElementById('userAddress').value;
        if (!name || !mobile || !address) { alert("দয়া করে নাম, মোবাইল নম্বর এবং পূর্ণাঙ্গ ঠিকানা দিন।"); return; }
        let cartItemsText = ""; let totalBill = 0; let count = 1;
        for (let id in cart) { cartItemsText += `${count}. ${cart[id].name} - ${cart[id].price} ৳\n`; totalBill += cart[id].price; count++; }
        if (totalBill === 0) { alert("আপনার কার্ট খালি! অন্তত একটি পণ্য অর্ডার করুন।"); return; }
        let message = `*নতুন অর্ডার এসেছে*\n👤 নাম: ${name}\n📞 মোবাইল: ${mobile}\n📍 ঠিকানা: ${address}\n\n*পণ্যসমূহ:*\n${cartItemsText}\n*💰 মোট বিল:* ${totalBill} ৳`;
        window.open(`https://whatsapp.com{encodeURIComponent(message)}`, '_blank');
    }
    window.onload = loadCustomerPanel;
</script>
</body>
</html>
