<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Bazar - Admin Dashboard</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #f1f2f6; }
        .navbar { background-color: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { margin: 0; font-size: 20px; }
        .main-container { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-section { background: #f8f9fa; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #ddd; }
        .grid-inputs { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 10px; }
        .full-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 10px; }
        .btn-add { background-color: #2ec771; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .bulk-actions { margin-bottom: 15px; display: flex; gap: 10px; }
        .btn-delete-all { background-color: #c0392b; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .product-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .product-table th, .product-table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        .product-table th { background-color: #34495e; color: white; }
        .btn-delete-single { background:#e74c3c; color:#fff; border:none; padding:4px 8px; cursor:pointer; border-radius:4px; }
    </style>
</head>
<body>

    <div class="navbar">
        <h1><i class="fas fa-user-shield"></i> Khan Bazar - অ্যাডমিন প্যানেল</h1>
        <span>আজকের আইটেম সংখ্যা: <span id="product-count">0</span>টি</span>
    </div>

    <div class="main-container">
        <!-- নতুন পণ্য যোগ করার ফর্ম -->
        <div class="form-section">
            <h3><i class="fas fa-plus-circle"></i> নতুন পণ্য ও মূল্য তালিকা আপডেট করুন</h3>
            <div class="grid-inputs">
                <input type="text" id="admin-pname" placeholder="পণ্যের নাম (যেমন: মিনিকেট চাল)">
                <input type="number" id="admin-pprice" placeholder="মূল্য (৳)">
            </div>
            <input type="text" id="admin-pimg" class="full-input" placeholder="পণ্যের ছবির অনলাইন লিংক/URL (ঐচ্ছিক)">
            <button class="btn-add" id="add-product-btn"><i class="fas fa-plus"></i> তালিকায় নতুন পণ্য যুক্ত করুন</button>
        </div>

        <!-- অ্যাকশন বাটনসমূহ -->
        <div class="bulk-actions">
            <button class="btn-delete-all" onclick="deleteSelectedProducts()"><i class="fas fa-trash-alt"></i> সিলেক্ট করা সব মুছুন</button>
        </div>

        <!-- পণ্যের তালিকা টেবিল -->
        <table class="product-table">
            <thead>
                <tr>
                    <th width="5%"><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"></th>
                    <th>ছবি</th>
                    <th>পণ্যের নাম</th>
                    <th>মূল্য</th>
                    <th>অ্যাকশন</th>
                </tr>
            </thead>
            <tbody id="admin-product-list">
                <!-- জাভাস্ক্রিপ্ট দিয়ে ডেটা এখানে আসবে -->
            </tbody>
        </table>
    </div>

<script>
// ডেমো পণ্য তালিকা
const defaultProducts = [
    { id: 1, name: "মিনিকেট চাল (৫ কেজি)", price: 350, img: "https://unsplash.com" },
    { id: 2, name: "সয়াবিন তেল (১ লিটার)", price: 165, img: "https://unsplash.com" },
    { id: 3, name: "প্যারাশুট নারিকেল তেল", price: 85, img: "https://unsplash.com" },
    { id: 4, name: "মসুর ডাল (১ কেজি)", price: 140, img: "https://unsplash.com" },
    { id: 5, name: "চিনি (১ কেজি)", price: 135, img: "https://unsplash.com" }
];

let products = JSON.parse(localStorage.getItem('khanBazarProducts')) || defaultProducts;
const productListBody = document.getElementById('admin-product-list');
const productCountSpan = document.getElementById('product-count');

function displayProducts() {
    productListBody.innerHTML = "";
    productCountSpan.innerText = products.length;

    products.forEach((product, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="checkbox" class="product-checkbox" data-index="${index}"></td>
            <td><img src="${product.img}" width="40" height="40" style="object-fit:cover; border-radius:4px;"></td>
            <td>${product.name}</td>
            <td>৳ ${product.price}</td>
            <td><button class="btn-delete-single" onclick="deleteSingleProduct(${index})">মুছুন</button></td>
        `;
        productListBody.appendChild(row);
    });

    localStorage.setItem('khanBazarProducts', JSON.stringify(products));
}

// সিলেক্ট অল টিক চিহ্নের লজিক
function toggleSelectAll(masterCheckbox) {
    const checkboxes = document.querySelectorAll('.product-checkbox');
    checkboxes.forEach(cb => cb.checked = masterCheckbox.checked);
}

// একটা পণ্য মোছার লজিক
function deleteSingleProduct(index) {
    if(confirm("আপনি কি এই পণ্যটি ডিলিট করতে চান?")) {
        products.splice(index, 1);
        displayProducts();
    }
}

// সিলেক্ট করা সব পণ্য একসাথে ডিলিট করার লজিক
function deleteSelectedProducts() {
    const checkboxes = document.querySelectorAll('.product-checkbox:checked');
    if(checkboxes.length === 0) {
        alert("দয়া করে প্রথমে পণ্য সিলেক্ট করুন!");
        return;
    }

    if(confirm(`আপনি কি এই ${checkboxes.length}টি পণ্য একসাথে ডিলিট করতে চান?`)) {
        const indicesToDelete = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-index'))).sort((a, b) => b - a);
        
        indicesToDelete.forEach(index => {
            products.splice(index, 1);
        });

        document.getElementById('selectAllCheckbox').checked = false; // মাস্টার চেকবক্স রিসেট
        displayProducts();
    }
}

// নতুন পণ্য যোগ করার লজিক
document.getElementById('add-product-btn').addEventListener('click', function() {
    const nameInput = document.getElementById('admin-pname').value;
    const priceInput = document.getElementById('admin-pprice').value;
    const imgInput = document.getElementById('admin-pimg').value || "https://unsplash.com";

    if(!nameInput || !priceInput) {
        alert("দয়া করে নাম এবং মূল্য সঠিকভাবে লিখুন!");
        return;
    }

    products.push({
        id: Date.now(),
        name: nameInput,
        price: parseInt(priceInput),
        img: imgInput
    });

    document.getElementById('admin-pname').value = "";
    document.getElementById('admin-pprice').value = "";
    document.getElementById('admin-pimg').value = "";
    displayProducts();
});

window.onload = displayProducts;
</script>
</body>
</html>
