<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আজকের লাইভ বাজার - নিয়ন্ত্রণ বোর্ড</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #eee;
            padding: 10px;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .box {
            max-width: 550px;
            margin: 0 auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
        }
        .product-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            content: "";
            padding: 10px 0;
            border-bottom: 1px solid #ddd;
        }
        .product-name {
            font-size: 15px;
            font-weight: bold;
            color: #444;
            width: 35%;
            text-align: left;
        }
        .input-item {
            width: 16%;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 13px;
            text-align: center;
        }
        .btn-hide {
            width: 22%;
            padding: 6px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #f44336;
            color: white;
        }
        .button.main-save {
            background: #008CBA;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }
        .scroll-area {
            height: 70vh;
            overflow-y: scroll;
            padding-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="box">
    <h3 style="margin-top:0; color:#008CBA; text-align:center; margin-bottom: 15px;">🛒 লাইভ বাজার তালিকা নিয়ন্ত্রণ বোর্ড</h3>
    
    <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:bold; color:#777; padding-bottom:5px; border-bottom:2px solid #ccc; margin-bottom: 10px;">
        <span style="width:35%; text-align:left;">আইটেম</span>
        <span style="width:16%; text-align:center;">দাম</span>
        <span style="width:16%; text-align:center;">ছাড়%</span>
        <span style="width:22%; text-align:center;">অ্যাকশন</span>
    </div>

    <!-- এই ডিভ-এর ভেতরে সব পণ্য জাভাস্ক্রিপ্ট দিয়ে লোড হবে -->
    <div class="scroll-area" id="admin-container"></div>

    <!-- সব ডাটা একসাথে সেভ করার বাটন -->
    <button class="button main-save" onclick="saveAllPrices()">সব পরিবর্তন একসাথে সেভ করুন</button>
</div>

<script>
    // ডিলিট করে শর্টকাট করা প্রধান ২৫টি মুদি পণ্যের তালিকা
    const products = [
        { id: "p1", name: "মিনিকেট চাল" },
        { id: "p2", name: "নাজিরশাইল চাল" },
        { id: "p3", name: "পোলাও চাল" },
        { id: "p4", name: "মসুর ডাল (দেশী)" },
        { id: "p5", name: "মসুর ডাল (মোটা)" },
        { id: "p6", name: "মুগ ডাল" },
        { id: "p7", name: "ছোলা ডাল" },
        { id: "p8", name: "সয়াবিন তেল (১ লিটার)" },
        { id: "p9", name: "সয়াবিন তেল (৫ লিটার)" },
        { id: "p10", name: "খাঁটি সরিষার তেল" },
        { id: "p11", name: "দেশী পেঁয়াজ" },
        { id: "p12", name: "রসুন" },
        { id: "p13", name: "আদা" },
        { id: "p14", name: "প্যাকেট চিনি" },
        { id: "p15", name: "আয়োডিনযুক্ত লবণ" },
        { id: "p16", name: "আটা (২ কেজি)" },
        { id: "p17", name: "ময়দা (২ কেজি)" },
        { id: "p18", name: "ফার্মের ডিম (ডজন)" },
        { id: "p19", name: "গুঁড়ো দুধ (৫০০ গ্রাম)" },
        { id: "p20", name: "চা পাতা" },
        { id: "p21", name: "হলুদ গুঁড়ো" },
        { id: "p22", name: "মরিচ গুঁড়ো" },
        { id: "p23", name: "জিরা" },
        { id: "p24", name: "ধনে গুঁড়ো" },
        { id: "p25", name: "তেজপাতা ও গরম মসলা" }
    ];

    // পেজ লোড হওয়ার সাথে সাথে পণ্যগুলো স্ক্রিনে দেখানোর ফাংশন
    function loadAdminPanel() {
        const container = document.getElementById('admin-container');
        let htmlContent = "";

        products.forEach(product => {
            // যদি কোনো আইটেম আগে থেকেই বাদ দেওয়া থাকে তবে তা স্ক্রিনে আসবে না
            if (localStorage.getItem('hide-' + product.id) === 'true') {
                return;
            }

            htmlContent += `
            <div class="product-row" id="row-${product.id}">
                <div class="product-name">${product.name}</div>
                
                <!-- দাম ইনপুট ফিল্ড -->
                <input type="number" class="input-item" id="price-${product.id}" placeholder="দাম" 
                       value="${localStorage.getItem('price-' + product.id) || ''}">
                
                <!-- ছাড়% ইনপুট ফিল্ড -->
                <input type="number" class="input-item" id="discount-${product.id}" placeholder="%" 
                       value="${localStorage.getItem('discount-' + product.id) || ''}">
                
                <!-- বাদ দিন বাটন -->
                <button class="btn-hide" onclick="toggleItem('${product.id}')">বাদ দিন</button>
            </div>
            `;
        });

        container.innerHTML = htmlContent;
    }

    // তালিকা থেকে কোনো আইটেম সাময়িক বাদ দেওয়ার ফাংশন
    function toggleItem(id) {
        if (confirm("আপনি কি নিশ্চিতভাবে এই আইটেমটি তালিকা থেকে বাদ দিতে চান?")) {
            localStorage.setItem('hide-' + id, 'true');
            loadAdminPanel(); // তালিকা রিফ্রেশ করবে
        }
    }

    // "সব পরিবর্তন একসাথে সেভ করুন" বাটনে ক্লিক করলে ইনপুট করা সব দাম সেভ হবে
    function saveAllPrices() {
        products.forEach(product => {
            if (localStorage.getItem('hide-' + product.id) !== 'true') {
                const priceElement = document.getElementById(`price-${product.id}`);
                const discountElement = document.getElementById(`discount-${product.id}`);
                
                if (priceElement && discountElement) {
                    localStorage.setItem('price-' + product.id, priceElement.value);
                    localStorage.setItem('discount-' + product.id, discountElement.value);
                }
            }
        });

        alert("🎉 আপনার সব পরিবর্তন (দাম ও ছাড়) সফলভাবে সেভ করা হয়েছে!");
    }

    // পেজ রান হওয়ার সাথে সাথে ফাংশনটি চালু হবে
    window.onload = function() {
        loadAdminPanel();
    };
</script>

</body>
</html>
