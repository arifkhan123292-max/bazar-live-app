<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>খান বাজার - এডমিন প্যানেল</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 20px; }
        header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; }
        .form-control { flex: 2; display: flex; flex-direction: column; gap: 5px; }
        .form-control label { font-weight: bold; font-size: 14px; }
        .form-control input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .btn-submit { background-color: #3498db; color: white; border: none; padding: 11px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-submit:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-delete:hover { background-color: #c0392b; }
        .nav-link { display: inline-block; margin-top: 10px; color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1>খান বাজার - এডমিন ম্যানেজমেন্ট</h1>
    <a href="index.html" class="nav-link" style="color: #2ecc71;">🛒 কাস্টমার পেজে যান</a>
</header>

<div class="container">
    <h2 style="margin-bottom: 15px; color:#2c3e50;">নতুন মুদি পণ্য যুক্ত করুন</h2>
    
    <!-- পণ্য যোগ করার ফর্ম -->
    <div class="form-group">
        <div class="form-control">
            <label for="pName">পণ্যের নাম:</label>
            <input type="text" id="pName" placeholder="উদা: চিনি (১ কেজি)">
        </div>
        <div class="form-control" style="flex: 1;">
            <label for="pPrice">মূল্য (৳):</label>
            <input type="number" id="pPrice" placeholder="৳">
        </div>
        <button class="btn-submit" onclick="addProduct()">যুক্ত করুন</button>
    </div>

    <!-- পণ্যের তালিকা টেবিল -->
    <h2 style="margin-top: 30px; margin-bottom: 15px; color:#2c3e50;">বর্তমান স্টক তালিকা</h2>
    <table>
        <thead>
            <tr>
                <th>আইডি</th>
                <th>পণ্যের নাম</th>
                <th>মূল্য (টাকা)</th>
                <th>অ্যাকশন</th>
            </tr>
        </thead>
        <tbody id="adminProductTable"></tbody>
    </table>
</div>

<script>
let products = JSON.parse(localStorage.getItem('grocery_products')) || [];

// টেবিল আপডেট করা
function updateAdminTable() {
    const tableBody = document.getElementById('adminProductTable');
    tableBody.innerHTML = '';
    
    if(products.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#7f8c8d;">স্টকে কোনো পণ্য নেই</td></tr>`;
        return;
    }

    products.forEach((product, index) => {
        tableBody.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td style="font-weight:600;">${product.name}</td>
                <td>৳ ${product.price}</td>
                <td><button class="btn-delete" onclick="deleteProduct(${product.id})">মুছে ফেলুন</button></td>
            </tr>
        `;
    });
}

// নতুন পণ্য যোগ করা
function addProduct() {
    const nameInput = document.getElementById('pName');
    const priceInput = document.getElementById('pPrice');
    
    const name = nameInput.value.trim();
    const price = parseInt(priceInput.value);

    if (!name || !price) {
        alert("দয়া করে পণ্যের নাম এবং সঠিক মূল্য লিখুন।");
        return;
    }

    const newProduct = {
        id: Date.now(), // ইউনিক আইডির জন্য টাইমস্ট্যাম্প
        name: name,
        price: price
    };

    products.push(newProduct);
    localStorage.setItem('grocery_products', JSON.stringify(products));
    
    // ইনপুট ফিল্ড খালি করা
    nameInput.value = '';
    priceInput.value = '';
    
    updateAdminTable();
    alert("পণ্যটি সফলভাবে যুক্ত হয়েছে!");
}

// পণ্য ডিলিট করা
function deleteProduct(id) {
    if(confirm("আপনি কি নিশ্চিতভাবে এই পণ্যটি ডিলিট করতে চান?")) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('grocery_products', JSON.stringify(products));
        updateAdminTable();
    }
}

// প্রথমবার লোড
updateAdminTable();
</script>

</body>
</html>
